# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "0da56880a2a9eeb0df93b0e779ad7381"
application_url = "https://ai-chat-widget-vert.vercel.app"
embedded = true
name = "ai-chat-widget"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,read_orders,read_files"

[app_proxy]
url = "https://ai-chat-widget-vert.vercel.app/apps/chat-widget"
subpath = "chat-widget"
prefix = "apps"

[webhooks]
api_version = "2026-10"
customers_data_request_url = "/webhooks/customers/data_request"
customers_redact_url = "/webhooks/customers/redact"
shop_redact_url = "/webhooks/shop/redact"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

[auth]
redirect_urls = [ "https://ai-chat-widget-vert.vercel.app/api/auth" ]

[build]
automatically_update_urls_on_dev = true
