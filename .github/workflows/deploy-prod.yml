name: Deploy prod Shopify app config

on:
  push:
    branches:
      - main

jobs:
  shopify-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # `npm run build` also runs `prisma migrate deploy`, which needs real
      # credentials and would apply migrations to the production database. That
      # belongs to the Vercel build, not to this verification gate — so run the
      # offline half only. Prisma still resolves env() at schema-validation time,
      # hence the placeholder URLs; nothing here opens a connection.
      - name: Build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=chat_widget
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci?schema=chat_widget
        run: npx prisma generate && npx react-router build

      - name: shopify app deploy
        env:
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
        run: npx shopify app deploy --config ai-chat-app --allow-updates
