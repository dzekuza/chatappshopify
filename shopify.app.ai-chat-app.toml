# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "491b02d88d133dfacc863cc6a7bdc8bf"
name = "AI Chat app"
application_url = "https://ai-chat-widget-vert.vercel.app"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_files,read_orders,read_products"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://ai-chat-widget-vert.vercel.app/api/auth" ]

[app_proxy]
url = "https://ai-chat-widget-vert.vercel.app/apps/chat-widget"
subpath = "chat-widget"
prefix = "apps"
