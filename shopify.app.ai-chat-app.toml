# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration
# This is the PRODUCTION config. Deploy with: shopify app deploy --config ai-chat-app

client_id = "491b02d88d133dfacc863cc6a7bdc8bf"
name = "Orby AI Chat Widget"
application_url = "https://ai-chat-widget-vert.vercel.app"
embedded = true

[build]
# Keep false on the production config so a `shopify app dev` session can't
# rewrite application_url/redirect_urls back to a tunnel URL.
automatically_update_urls_on_dev = false

[webhooks]
# Must match ApiVersion.July26 used in app/shopify.server.ts.
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

# Mandatory compliance webhooks. These must be declared as subscriptions with
# `compliance_topics` — the older top-level customers_data_request_url /
# customers_redact_url / shop_redact_url keys are not part of the current app
# config schema and get dropped on deploy, which makes the App Store's
# "Provides mandatory compliance webhooks" check fail.

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = [ "shop/redact" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_files,write_files,read_orders,read_products"
optional_scopes = [ ]
# Shopify managed installation — no legacy OAuth grant screen on install.
use_legacy_install_flow = false

[auth]
# authPathPrefix is "/auth" in app/shopify.server.ts, so the OAuth callback the
# library builds is <app_url>/auth/callback. The other two are the template's
# historical aliases, kept so an already-installed shop can still re-auth.
redirect_urls = [
  "https://ai-chat-widget-vert.vercel.app/auth/callback",
  "https://ai-chat-widget-vert.vercel.app/auth/shopify/callback",
  "https://ai-chat-widget-vert.vercel.app/api/auth/callback"
]

[app_proxy]
url = "https://ai-chat-widget-vert.vercel.app/apps/chat-widget"
subpath = "chat-widget"
prefix = "apps"
