# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration
# This is the DEV config — a separate Shopify app ("Chat app dev") with dev-store-only
# distribution, used for testing on the `development` branch. Deploy with:
#   shopify app deploy --config dev
#
client_id = "f691442dd71492e77c87eb0195ca1c99"
name = "Orby Chat DEV"
application_url = "https://ai-chat-widget-dev.vercel.app"
embedded = true

[build]
# false, same as the prod config: this app is also hosted (ai-chat-widget-dev on
# Vercel), so letting `shopify app dev` rewrite application_url to a tunnel breaks
# the hosted dev app the moment the tunnel dies.
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2026-07"
customers_data_request_url = "/webhooks/customers/data_request"
customers_redact_url = "/webhooks/customers/redact"
shop_redact_url = "/webhooks/shop/redact"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

[access_scopes]
scopes = "read_files,read_orders,read_products"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://ai-chat-widget-dev.vercel.app/auth/callback",
  "https://ai-chat-widget-dev.vercel.app/auth/shopify/callback",
  "https://ai-chat-widget-dev.vercel.app/api/auth/callback"
]

[app_proxy]
url = "https://ai-chat-widget-dev.vercel.app/apps/chat-widget"
subpath = "chat-widget"
prefix = "apps"
